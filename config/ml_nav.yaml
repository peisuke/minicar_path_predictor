# ML Navigation Node Configuration
# Tuned by Optuna (50 trials, median of 15 successful)

ml_nav_node:
  ros__parameters:
    # Model settings
    model_path: /home/ubuntu/ros2_ws/src/minicar_path_predictor/data/models/angle_predictor.pt

    # Common parameters (same keys as local_nav_node)
    common:
      lookahead_distance: 0.5    # Look-ahead distance [m] - fixed by model
      target_velocity: 3.0       # Target linear velocity [m/s]
      max_angular_velocity: 8.0  # Maximum angular velocity [rad/s]
      goal_tolerance: 0.1        # Goal tolerance [m]

    # Prediction smoothing
    prediction:
      ema_alpha: 0.4               # EMA smoothing factor [0=smooth, 1=no smoothing]

    # PD controller parameters
    controllers:
      pd:
        kp_angular: 4.0            # Angular velocity proportional gain
        kd_angular: 0.5            # Angular velocity derivative gain
        k_curvature: 1.0           # Curvature sensitivity for angle-rate deceleration
        min_velocity: 0.181        # Minimum velocity [m/s]
