# ML Navigation Node Configuration
# Geometric curvature control + Optuna geo_v2 (20 trials, best=#19, distance=112.2m/60s)

ml_nav_node:
  ros__parameters:
    # Model settings
    model_path: /home/ubuntu/ros2_ws/src/minicar_path_predictor/data/models/angle_predictor_multi_dist.pt

    # Common parameters (same keys as local_nav_node)
    common:
      lookahead_distance: 0.5    # Look-ahead distance [m] - fixed by model
      target_velocity: 4.456     # Target linear velocity [m/s]
      max_angular_velocity: 4.772 # Maximum angular velocity [rad/s] - low for stability
      goal_tolerance: 0.1        # Goal tolerance [m]

    # Prediction smoothing
    prediction:
      ema_alpha: 0.316             # EMA smoothing factor [0=smooth, 1=no smoothing]
      softmax_temperature: 2.586   # Softmax temperature [<1=sharper, >1=softer]
      ema_adaptive: false          # Adaptive EMA disabled
      ema_alpha_curve: 0.187       # (unused when adaptive=false)

    # PD controller parameters
    controllers:
      pd:
        kp_angular: 6.319        # Angular velocity proportional gain
        kd_angular: 1.926        # Angular velocity derivative gain
        k_curvature: 1.246       # Curvature sensitivity for geometric deceleration
        min_velocity: 0.215      # Minimum velocity [m/s]

    # Multi-distance geometric control (active when model has multiple heads)
    multi_distance:
      blend_base: 0.096           # Far weight at speed=0 [0.0-0.4]
      blend_speed_k: 0.008        # Far weight speed gain [0.0-0.5]
